# Builds one image per platform, each on a native runner, and merges them into
# one index. Callers use it as a job:
#
#   jobs:
#     image:
#       uses: osscontainertools/kaniko-action/.github/workflows/multiarch.yml@<commit>
#
# For a single job with emulated platforms, use the action's `platforms` input.
name: multiarch

on:
  workflow_call:
    inputs:
      context:
        description: Build context directory, relative to the repository.
        type: string
        default: .
      dockerfile:
        description: Path to the Dockerfile, relative to the build context.
        type: string
        default: Dockerfile
      destination:
        description: Image reference to push the index to. Each platform is also pushed as `<destination>-<arch>`, tagged `latest-<arch>` when `destination` has no tag. Empty pushes to `ghcr.io/<owner>/<repo>:<ref slug>`, as the action does.
        type: string
        default: ""
      target:
        description: Dockerfile stage to build. Empty builds the last stage.
        type: string
        default: ""
      build-args:
        description: Build arguments, one `KEY=value` per line.
        type: string
        default: ""
      push:
        description: Push the images. Without a push, nothing is merged.
        type: boolean
        default: true
      provenance:
        description: Attach a SLSA provenance attestation to each platform.
        type: boolean
        default: true
      reproducible:
        description: Strip timestamps from the images.
        type: boolean
        default: false
      cache:
        description: Layer cache in `<destination repository>/cache`, `off`, `on` or `split`. With `split` only the default branch writes it.
        type: string
        default: "off"
      github-token-secret:
        description: Offer the job's token to `RUN --mount=type=secret,id=github_token`.
        type: boolean
        default: false
      profile-preview:
        description: Enable kaniko's Preview profile.
        type: boolean
        default: false
      profile-buildkit:
        description: Enable kaniko's BuildKit compatibility profile.
        type: boolean
        default: false
      telemetry:
        description: "Where to send a trace of each build: `off`, `firn` or `custom`. `firn` and `custom` need `id-token: write`."
        type: string
        default: "off"
      telemetry-endpoint:
        description: OTLP/HTTP endpoint the trace goes to, with `telemetry` set to `custom`.
        type: string
        default: ""
      telemetry-token-exchange-endpoint:
        description: Endpoint that trades the job's ID token for a collector token, with `telemetry` set to `custom`.
        type: string
        default: ""
      bootstrap:
        description: Build an image that has files in `/kaniko` or `/busybox`, such as kaniko itself.
        type: boolean
        default: false
      platforms:
        description: Platforms to build, as a JSON list.
        type: string
        default: '["linux/amd64", "linux/arm64"]'
      runners:
        description: Runner label for each platform, as a JSON object.
        type: string
        default: '{"linux/amd64": "ubuntu-26.04", "linux/arm64": "ubuntu-26.04-arm"}'
      merge-image:
        description: Image with crane and jq that merges the platforms into one index.
        type: string
        default: registry.gitlab.com/osscontainertools/components/kaniko/merge:release-11b74ff77aae51e40166744b2c6e062c81633b84@sha256:322a2281f783d403be2b63ce88281f6ee54e9e08644d8f94628b5e23cdf6c4c8
    outputs:
      image:
        description: The pushed index pinned by digest, `repo@sha256:...`.
        value: ${{ jobs.merge.outputs.image }}

jobs:
  build:
    strategy:
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ fromJSON(inputs.runners)[matrix.platform] }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: src
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kaniko-action
      - id: destination
        env:
          DESTINATION: ${{ inputs.destination }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ -z "$DESTINATION" ]; then
            DESTINATION=$(.kaniko-action/destination.sh)
          fi
          case "${DESTINATION##*/}" in
            *:*) ;;
            *) DESTINATION="$DESTINATION:latest" ;;
          esac
          echo "destination=$DESTINATION-$(echo "${PLATFORM#*/}" | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: ./.kaniko-action
        with:
          context: src/${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          destination: ${{ steps.destination.outputs.destination }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          push: ${{ inputs.push }}
          provenance: ${{ inputs.provenance }}
          reproducible: ${{ inputs.reproducible }}
          cache: ${{ inputs.cache }}
          github-token-secret: ${{ inputs.github-token-secret }}
          profile-preview: ${{ inputs.profile-preview }}
          profile-buildkit: ${{ inputs.profile-buildkit }}
          telemetry: ${{ inputs.telemetry }}
          telemetry-endpoint: ${{ inputs.telemetry-endpoint }}
          telemetry-token-exchange-endpoint: ${{ inputs.telemetry-token-exchange-endpoint }}
          bootstrap: ${{ inputs.bootstrap }}

  merge:
    if: inputs.push
    needs: build
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.merge.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kaniko-action
      - id: merge
        env:
          DESTINATION: ${{ inputs.destination }}
          PLATFORMS: ${{ inputs.platforms }}
          MERGE_IMAGE: ${{ inputs.merge-image }}
          KANIKO_GHCR_IO_USER: ${{ github.actor }}
          KANIKO_GHCR_IO_PASSWORD: ${{ github.token }}
        run: |
          if [ -z "$DESTINATION" ]; then
            DESTINATION=$(.kaniko-action/destination.sh)
          fi
          case "${DESTINATION##*/}" in
            *:*) ;;
            *) DESTINATION="$DESTINATION:latest" ;;
          esac
          leaves=""
          for platform in $(echo "$PLATFORMS" | jq -r '.[]'); do
            leaves="$leaves $DESTINATION-$(echo "${platform#*/}" | tr / -)"
          done
          image=$(docker run --rm \
            --env MERGE_IMAGES="$leaves" --env MERGE_DESTINATION="$DESTINATION" \
            --env KANIKO_GHCR_IO_USER --env KANIKO_GHCR_IO_PASSWORD \
            --volume "$GITHUB_WORKSPACE/.kaniko-action/merge.sh:/merge.sh:ro" --entrypoint sh \
            "$MERGE_IMAGE" /merge.sh)
          echo "image=$image" >> "$GITHUB_OUTPUT"
