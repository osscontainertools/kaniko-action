name: pre-commit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
      - run: uv pip install -r pylock.toml --preview-features pylock --system
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: verify the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --no-fix
