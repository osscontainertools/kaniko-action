# Multi-arch in one step on one runner: the action builds the runner's own
# platform natively, emulates the others with QEMU, and merges them into one
# index. Simple, but RUN steps under emulation are slow. For native speed, see
# test-multiarch.yml.
name: test-multiarch-emulated

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# kaniko runs on the default bridge and reaches the registry service through
# its gateway, the runner reaches the same registry as localhost:5000.
env:
  REGISTRY: 172.17.0.1:5000

jobs:
  build:
    runs-on: ubuntu-26.04
    services:
      registry:
        image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7.0.1
      - id: build
        uses: ./
        with:
          context: tests/multiarch
          destination: ${{ env.REGISTRY }}/test-multiarch-emulated:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
      - name: verify
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          MERGE_IMAGE: registry.gitlab.com/osscontainertools/components/kaniko/merge:release-11b74ff77aae51e40166744b2c6e062c81633b84@sha256:322a2281f783d403be2b63ce88281f6ee54e9e08644d8f94628b5e23cdf6c4c8
        run: |
          ref="localhost:5000/${IMAGE#*/}"
          test "$(docker run --rm --network host "$MERGE_IMAGE" crane manifest "$ref" | jq -c '[.manifests[].platform | select(.os != "unknown") | .architecture] | sort')" = '["amd64","arm64"]'
          for arch in amd64 arm64; do
            test "$(docker run --rm --platform "linux/$arch" "$ref" cat /arch)" = "$arch"
          done
