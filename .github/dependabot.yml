---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: docker
    directories:
      - /tests/*
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    groups:
      docker:
        patterns:
          - "*"
